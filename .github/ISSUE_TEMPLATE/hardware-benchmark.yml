name: Hardware benchmark
description: Report synthesis, simulation, or board measurements for gate-lowered Integer GPT work
title: "[hardware] "
labels: ["hardware"]
body:
  - type: markdown
    attributes:
      value: |
        Negative results are useful. Report area, timing, power, and how the
        design was verified, even if the numbers are modest.
  - type: input
    id: handle
    attributes:
      label: GitHub handle
      placeholder: "@your-handle"
    validations:
      required: true
  - type: input
    id: board
    attributes:
      label: Board or target
      placeholder: "e.g. iCE40 UP5K, ECP5, Artix-7, simulation only"
    validations:
      required: true
  - type: input
    id: toolchain
    attributes:
      label: Toolchain
      placeholder: "e.g. Yosys/nextpnr, Vivado 2025.1, Quartus"
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: What was implemented?
      options:
        - One transformer block
        - Attention only
        - MLP only
        - RMSNorm / GELU / softmax primitive
        - Full tiny GPT
        - Simulation or verification only
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification against the integer reference
      description: Fixed vectors, cycle traces, mismatch count, and the C/WASM reference commit.
    validations:
      required: true
  - type: textarea
    id: area
    attributes:
      label: Area and timing
      description: LUTs, flip-flops, BRAM, DSP, clock constraint, worst slack, and utilization.
      render: text
    validations:
      required: true
  - type: textarea
    id: performance
    attributes:
      label: Latency, throughput, and power
      description: Tokens per second, latency per token, clock, measured or estimated power, and how power was measured.
      render: text
  - type: input
    id: logs
    attributes:
      label: Log or report link
  - type: textarea
    id: notes
    attributes:
      label: What was hard, what should change, and what to try next
